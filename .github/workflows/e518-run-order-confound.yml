name: E518 measured CPU run-order confound audit

on:
  push:
    branches:
      - research/e518-run-order-confound-20261111
    paths:
      - research/e518_run_order_confound.py
      - research/test_e518_run_order_confound.py
      - research/E518_RUN_ORDER_CONFOUND_AUDIT_20261111.md
      - research/results/e516_cpu_stress_holdout_traces.csv
      - research/results/e516_cpu_stress_catalog.csv
      - research/results/e516_cpu_stress_provenance.json
      - .github/workflows/e518-run-order-confound.yml
  pull_request:
    branches:
      - research/e507-matched-copula-family-20261102
    paths:
      - research/e518_run_order_confound.py
      - research/test_e518_run_order_confound.py
      - research/E518_RUN_ORDER_CONFOUND_AUDIT_20261111.md
      - research/results/e516_cpu_stress_holdout_traces.csv
      - research/results/e516_cpu_stress_catalog.csv
      - research/results/e516_cpu_stress_provenance.json
      - .github/workflows/e518-run-order-confound.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit dependencies
        run: python -m pip install "numpy>=1.26,<3" "pytest>=8,<9"
      - name: Run E518 integrity and falsification tests
        run: python -m pytest -q research/test_e518_run_order_confound.py
      - name: Recompute the pinned E516 order audit
        run: |
          python -m research.e518_run_order_confound \
            --traces research/results/e516_cpu_stress_holdout_traces.csv \
            --catalog research/results/e516_cpu_stress_catalog.csv \
            --provenance research/results/e516_cpu_stress_provenance.json \
            --out .data/e518/e518_receipt.json
      - name: Preserve compact E518 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e518-run-order-audit
          path: .data/e518/e518_receipt.json
          if-no-files-found: ignore
          retention-days: 14
