name: foundry-ruff-fix

on:
  push:
    branches:
      - foundry/ruff-debt-part1

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.16.8'
      - name: Apply safe Ruff fixes only
        run: ruff check . --fix
        continue-on-error: true
      - name: Commit deterministic safe fixes
        run: |
          if git diff --quiet; then
            echo 'No safe Ruff fixes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style: apply safe Ruff fixes'
          git push origin HEAD:foundry/ruff-debt-part1
