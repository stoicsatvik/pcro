name: foundry-ruff-fix

on:
  push:
    branches:
      - foundry/ruff-debt-part1

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.16.8'
      - name: Resolve remaining reviewed Ruff findings
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('pcro/cli.py'): [
                  ('raise ValueError("trace file must contain a JSON list")',
                   'raise TypeError("trace file must contain a JSON list")'),
              ],
              Path('pcro/failure_taxonomy.py'): [
                  ('error.startswith("denied:") or error.startswith("confirm_required:")',
                   'error.startswith(("denied:", "confirm_required:"))'),
              ],
              Path('pcro/jed_contract.py'): [
                  ('    try:\n        candidates.add(urllib.parse.unquote_plus(value))\n        candidates.add(urllib.parse.unquote(value))\n    except Exception:\n        pass\n',
                   '    candidates.add(urllib.parse.unquote_plus(value))\n    candidates.add(urllib.parse.unquote(value))\n'),
                  ('error.startswith("denied:") or error.startswith("confirm_required:")',
                   'error.startswith(("denied:", "confirm_required:"))'),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'expected lint pattern missing in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify complete lint contract
        run: ruff check .
      - name: Remove one-shot fixer and commit cleanup
        run: |
          git rm .github/workflows/foundry-ruff-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style: clear demonstrated Ruff debt'
          git push origin HEAD:foundry/ruff-debt-part1
