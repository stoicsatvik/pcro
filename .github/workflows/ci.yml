name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: pcro properties --seeds 500
      - name: E225 exact family-diversification falsification
        run: python experiments/e225_family_diversification.py > e225_family_diversification.json
      - uses: actions/upload-artifact@v4
        with:
          name: e225-family-diversification
          path: e225_family_diversification.json
      - name: E244 exact cross-family common-shock falsification
        run: python experiments/e244_global_shock_diversification.py > e244_global_shock_diversification.json
      - uses: actions/upload-artifact@v4
        with:
          name: e244-global-shock-diversification
          path: e244_global_shock_diversification.json

      - name: E260 exact pairwise-independent tail non-identifiability
        run: python experiments/e260_pairwise_tail_nonidentifiability.py > e260_pairwise_tail_nonidentifiability.json
      - uses: actions/upload-artifact@v4
        with:
          name: e260-pairwise-tail-nonidentifiability
          path: e260_pairwise_tail_nonidentifiability.json

  jed-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install PCRO and pinned public JED SDK source
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'git+https://github.com/mbhatt1/competitionscratch.git@30c769419a09f3dc64d5606a0a097b8a2a61c110'
      - name: Run randomized evaluator parity
        run: |
          python - <<'PY'
          from pcro.parity import run_random_parity
          report = run_random_parity(1000)
          print(report.to_dict())
          if not report.passed:
              raise SystemExit(1)
          PY
