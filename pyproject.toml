[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcro"
version = "0.2.0"
description = "Predicate-Compiled Replay Optimisation research toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Satvik"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ml = ["torch>=2.4"]

[project.scripts]
pcro = "pcro.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
